services:
  web-development:
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies
    image: cvsu-bacoor-website:development
    container_name: cvsu-bacoor-website-development
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0

  web-production:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvsu-bacoor-website:latest
    container_name: cvsu-bacoor-website-production
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
